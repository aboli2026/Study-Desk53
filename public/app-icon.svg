<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>
  
  <!-- Desk / Laptop & Open Book Motif -->
  <!-- Ambient glow -->
  <circle cx="256" cy="240" r="140" fill="#38bdf8" opacity="0.12" filter="blur(30px)"/>

  <!-- Open Book Pages -->
  <g transform="translate(106, 140)">
    <!-- Left page -->
    <path d="M150 50 C100 20, 30 30, 10 38 C4 39, 0 44, 0 50 L0 200 C0 206, 5 211, 11 210 C35 204, 100 196, 150 220 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M30 80 L120 70 M30 110 L120 100 M30 140 L100 132" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <!-- Right page -->
    <path d="M150 50 C200 20, 270 30, 290 38 C296 39, 300 44, 300 50 L300 200 C300 206, 295 211, 289 210 C265 204, 200 196, 150 220 Z" fill="#f8fafc" fill-opacity="0.9"/>
    <path d="M180 70 L270 80 M180 100 L270 110 M180 132 L250 140" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>

    <!-- Spine -->
    <path d="M150 48 L150 222" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Bookmark ribbon -->
    <path d="M150 48 Q165 90 160 130 L150 120 L140 130 Q145 90 150 48" fill="#38bdf8"/>
  </g>
</svg>
